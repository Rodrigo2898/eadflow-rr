spring:
  datasource:
    url: ${DB_URL}                  
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10         
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false                 
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.eduflow: INFO               

server:
  port: ${PORT:8080}

rr:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 86400000