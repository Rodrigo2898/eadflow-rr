spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # dev por padrão, prod via env em produção

  # Configurações de serialização JSON
#  jackson:
#    default-property-inclusion: non_null
#    deserialization:
#      fail-on-unknown-properties: false
#    serialization:
#      write-dates-as-timestamps: false
#    date-format: yyyy-MM-dd'T'HH:mm:ss

  # Upload de arquivos
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB



# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: EadFlow
    version: '@project.version@' 